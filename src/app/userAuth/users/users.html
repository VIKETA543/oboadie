@if(USERS){
<div class="card">
    <p-table #dt1 [value]="USERS" [tableStyle]="{ 'min-width': '50rem' }" stripedRows="true" dataKey="id" [rows]="10" [rowsPerPageOptions]="[10, 25, 50]" [paginator]="true" 
        [globalFilterFields]="['fullname', 'prim_phone_number', 'email_address']">

            
 <ng-template #caption>
                    <div class="flex">
                        <p-button label="Clear" [outlined]="true" icon="pi pi-filter-slash" (click)="clear(dt1)" />
                        <p-iconfield iconPosition="left" class="ml-auto">
                            <p-inputicon>
                                <i class="pi pi-search"></i>
                            </p-inputicon>
                            <input pInputText type="text" (input)="dt1.filterGlobal($event.target.value, 'contains')" placeholder="Search keyword" />
                        </p-iconfield>
                    </div>
                </ng-template>





        <ng-template #header>
            <tr>
                <th>No</th>
                <th>Full Name</th>
                <th>Photo</th>
                <th>Contact</th>
                <th>Email Address</th>
                <th>Auto Login</th>
                 <th>Access</th>
                 <th>Approval</th>
                <th>Action</th>
            </tr>
        </ng-template>
        <ng-template #body let-USERS let-i="rowIndex">
            <tr>
                <td>{{i+1}}</td>
                <td>{{ USERS.fullname }}</td>
                <td>
                    <p-avatar class="mr-2" size="xlarge" shape="circle" image="{{USERS.passport_picture_url}}"
                        shape="circle" size="normal"></p-avatar>
                </td>
                <td>{{ USERS.prim_phone_number }}</td>
                <td>{{ USERS.email_address }}</td>
                <td >
                    <p-toggleswitch [(ngModel)]="USERS.auto_login" (onChange)="onAutoLogin(USERS,$event)" />
                </td>
                  <td >
                    <p-toggleswitch [(ngModel)]="USERS.auth" (onChange)="onAccess(USERS,$event)" />
                </td>
      <td >
                    <p-toggleswitch [(ngModel)]="USERS.approved" (onChange)="onApproval(USERS,$event)" />
                </td>
                
                <td>
                    <p-splitbutton severity="info" id="auth" icon="pi pi-pencil" (onClick)="onActions()"
                        [model]="items" (mouseenter)="setUser(USERS)" />
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
}
<p-toast/>
